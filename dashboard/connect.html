<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Facebook - FixMyLeads</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <div class="max-w-4xl mx-auto p-8">
    <h1 class="text-3xl font-bold mb-8">Connect Your Accounts</h1>
    
    <!-- Facebook Connect -->
    <div class="bg-gray-800 rounded-xl p-6 mb-6 border border-gray-700">
      <div class="flex items-center gap-4 mb-4">
        <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </div>
        <div>
          <h2 class="text-xl font-semibold">Facebook & Instagram</h2>
          <p class="text-gray-400">Post to Pages, manage Instagram, run Ads</p>
        </div>
      </div>
      
      <div id="fb-status" class="mb-4">
        <div class="flex items-center gap-2 text-gray-400">
          <div class="w-2 h-2 bg-gray-500 rounded-full"></div>
          <span>Checking connection...</span>
        </div>
      </div>
      
      <div id="fb-pages" class="hidden mb-4"></div>
      
      <button id="fb-connect-btn" onclick="connectFacebook()" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Connect Facebook Account
      </button>
    </div>

    <!-- Google Sheets -->
    <div class="bg-gray-800 rounded-xl p-6 mb-6 border border-gray-700">
      <div class="flex items-center gap-4 mb-4">
        <div class="w-12 h-12 bg-green-600 rounded-full flex items-center justify-center">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
        </div>
        <div>
          <h2 class="text-xl font-semibold">Google Sheets</h2>
          <p class="text-gray-400">Auto-sync leads from your spreadsheet</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-green-400">
        <div class="w-2 h-2 bg-green-500 rounded-full"></div>
        <span>Connected - Auto-syncing leads</span>
      </div>
    </div>

    <!-- Lead Sources -->
    <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
      <div class="flex items-center gap-4 mb-4">
        <div class="w-12 h-12 bg-purple-600 rounded-full flex items-center justify-center">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        </div>
        <div>
          <h2 class="text-xl font-semibold">Lead Sources</h2>
          <p class="text-gray-400">Google Maps, LinkedIn, Web Scraping</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-yellow-400">
        <div class="w-2 h-2 bg-yellow-500 rounded-full"></div>
        <span>Configure in Settings → Lead Sources</span>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    
    async function checkStatus() {
      try {
        const res = await fetch(`${API_BASE}/auth/facebook/status?brand=fixmyleads`);
        const data = await res.json();
        
        const statusEl = document.getElementById('fb-status');
        const pagesEl = document.getElementById('fb-pages');
        const btnEl = document.getElementById('fb-connect-btn');
        
        if (data.connected) {
          statusEl.innerHTML = `
            <div class="flex items-center gap-2 text-green-400">
              <div class="w-2 h-2 bg-green-500 rounded-full"></div>
              <span>Connected! ${data.facebook.length} page(s), ${data.instagram.length} Instagram, ${data.ads.length} ad account(s)</span>
            </div>
          `;
          pagesEl.innerHTML = data.facebook.map(p => `
            <div class="bg-gray-700 rounded-lg p-3 mb-2 flex justify-between items-center">
              <span>${p.name}</span>
              <span class="text-xs px-2 py-1 bg-green-600 rounded">${p.status}</span>
            </div>
          `).join('');
          pagesEl.classList.remove('hidden');
          btnEl.textContent = 'Reconnect Facebook';
          btnEl.classList.remove('bg-blue-600', 'hover:bg-blue-700');
          btnEl.classList.add('bg-gray-600', 'hover:bg-gray-700');
        } else {
          statusEl.innerHTML = `
            <div class="flex items-center gap-2 text-gray-400">
              <div class="w-2 h-2 bg-gray-500 rounded-full"></div>
              <span>Not connected</span>
            </div>
          `;
        }
      } catch (e) {
        console.error('Status check failed:', e);
      }
    }
    
    async function connectFacebook() {
      try {
        const res = await fetch(`${API_BASE}/auth/facebook/connect?brand=fixmyleads`);
        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        } else {
          alert('Error: ' + (data.error || 'Could not generate OAuth URL'));
        }
      } catch (e) {
        alert('Connection failed: ' + e.message);
      }
    }
    
    // Check status on load
    checkStatus();
    
    // Handle OAuth callback results
    const params = new URLSearchParams(window.location.search);
    if (params.get('fb_connected')) {
      alert(`Facebook connected! ${params.get('pages')} page(s), ${params.get('instagram')} Instagram, ${params.get('ads')} ad account(s)`);
      checkStatus();
    }
    if (params.get('fb_error')) {
      alert('Facebook connection failed: ' + params.get('fb_error'));
    }
  </script>
</body>
</html>
